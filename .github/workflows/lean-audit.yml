name: Lean theorem audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: carry-self-adjoint-operator-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Exact-checkout Lean theorem audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUDITED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a synthetic or dirty checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run static source audit
        run: bash scripts/static_audit.sh

      - name: Reclaim runner disk for the Lean workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
          echo "Disk after cleanup:"
          df -h /

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Run complete kernel audit
        run: bash scripts/audit.sh
