name: Completed boundary trace green receipt

on:
  pull_request:
    paths:
      - 'CarrySelfAdjointOperator/ScalarBoundaryCrossProvenance.lean'
      - 'CarrySelfAdjointOperator/TwoLegBoundaryCrossProvenance.lean'
      - 'CarrySelfAdjointOperator/ReflectedScalarBoundaryTrace.lean'
      - 'CarrySelfAdjointOperator/EnrichedTfvdBoundaryEdgeFlattening.lean'
      - 'CarrySelfAdjointOperator/CompletedTfvdBoundaryTraceReduction.lean'
      - 'CarrySelfAdjointOperator/BoundaryTraceAudit.lean'
      - '.github/workflows/completed-boundary-trace-green-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  receipt:
    name: Exact-checkout boundary trace green receipt
    runs-on: ubuntu-24.04
    env:
      AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AUDITED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a synthetic or dirty checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run static source audit
        run: bash scripts/static_audit.sh

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
          mk_all-check: false
          check-reservoir-eligibility: false
          leanchecker: false
          lean4checker: false
          nanoda: false

      - name: Compile the complete boundary-trace theorem surface
        shell: bash
        run: |
          set -euo pipefail
          lake build --wfail CarrySelfAdjointOperator.BoundaryTraceAudit
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish the exact green receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          body="BOUNDARY_TRACE_GREEN: exact head ${AUDITED_SHA} compiled ScalarBoundaryCrossProvenance, TwoLegBoundaryCrossProvenance, ReflectedScalarBoundaryTrace, EnrichedTfvdBoundaryEdgeFlattening, CompletedTfvdBoundaryTraceReduction, and BoundaryTraceAudit with --wfail."
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$body"
